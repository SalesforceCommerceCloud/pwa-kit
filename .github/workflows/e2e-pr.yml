name: SalesforceCommerceCloud/pwa-kit/e2e-pr
on:
    workflow_dispatch:
    pull_request: # Default: opened, reopened, synchronize (head branch updated)
    merge_group: # Trigger GA workflow when a pull request is added to a merge queue.
    push:
        branches:
            - develop
            - 'release-*'



permissions:
    id-token: write
    contents: read

jobs:
    test_e2e_private:
        runs-on: ubuntu-latest
        env:
            # 🦕 GRUG SIMPLE: These will be set dynamically by the SQLite queue
            MRT_TARGET_SLUG: ""
            MRT_TARGET_URL: ""

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check PWA Kit Version
              run: |-
                  version=`jq -r ".version" package.json`
                  echo "pwa_kit_version=$version" >> "$GITHUB_ENV"

            # TODO: Skip the entire workflow since we don't have e2e tests for PWA Kit v2.x
            - name: Skip if PWA Kit version older than v3.x
              run: |
                  major_version=$(echo "${{ env.pwa_kit_version }}" | cut -d. -f1)
                   if [ "$major_version" -lt 3 ]; then
                     echo "PWA Kit version is older than v3.x, skipping workflow."
                     echo "SKIP_WORKFLOW=true" >> "$GITHUB_ENV"
                   fi

            # Only test for latest Node version supported by MRT
            - name: Setup Node
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install Monorepo Dependencies
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              run: |-
                  # Install node dependencies
                  node ./scripts/gtime.js monorepo_install npm ci

            # 🦕 GRUG SIMPLE: SQLite-based environment queue (no AWS complexity!)
            - name: Download Environment Queue Database
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: actions/download-artifact@v4
              with:
                  name: environment-queue-db
                  path: .
              continue-on-error: true

            - name: Acquire MRT Environment
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              run: |
                  # Create SQLite database with environment pool if it doesn't exist
                  sqlite3 env_queue.db << 'EOF'
                  CREATE TABLE IF NOT EXISTS environments (
                    slug TEXT PRIMARY KEY,
                    url TEXT NOT NULL,
                    status TEXT DEFAULT 'available',
                    pr_number INTEGER,
                    acquired_at DATETIME,
                    acquired_by TEXT
                  );
                  
                  -- Insert available MRT environments (add more as needed)
                  INSERT OR IGNORE INTO environments (slug, url) VALUES 
                  ('e2e-tests-pwa-kit', 'https://scaffold-pwa-e2e-tests-pwa-kit.mobify-storefront.com'),
                  ('e2e-tests-pwa-kit-2', 'https://scaffold-pwa-e2e-tests-pwa-kit-2.mobify-storefront.com'),
                  ('e2e-tests-pwa-kit-3', 'https://scaffold-pwa-e2e-tests-pwa-kit-3.mobify-storefront.com');
                  EOF
                  
                  # Atomic environment acquisition with retry logic
                  for attempt in {1..10}; do
                    echo "🔄 Attempt $attempt to acquire environment..."
                    
                    RESULT=$(sqlite3 env_queue.db << 'EOF'
                  BEGIN IMMEDIATE;
                  UPDATE environments 
                  SET status = 'in-use', 
                      pr_number = ${{ github.event.pull_request.number || 0 }},
                      acquired_at = datetime('now'),
                      acquired_by = '${{ github.run_id }}'
                  WHERE slug = (
                    SELECT slug FROM environments 
                    WHERE status = 'available' 
                    ORDER BY slug
                    LIMIT 1
                  );
                  
                  SELECT slug || '|' || url FROM environments 
                  WHERE acquired_by = '${{ github.run_id }}' 
                  AND status = 'in-use';
                  COMMIT;
                  EOF
                  )
                    
                    if [ -n "$RESULT" ]; then
                      ENV_SLUG=$(echo "$RESULT" | cut -d'|' -f1)
                      ENV_URL=$(echo "$RESULT" | cut -d'|' -f2)
                      echo "✅ Acquired environment: $ENV_SLUG"
                      echo "🌐 Environment URL: $ENV_URL"
                      echo "MRT_TARGET_SLUG=$ENV_SLUG" >> $GITHUB_ENV
                      echo "MRT_TARGET_URL=$ENV_URL" >> $GITHUB_ENV
                      break
                    fi
                    
                    if [ $attempt -eq 10 ]; then
                      echo "❌ No environments available after 10 attempts"
                      echo "📊 Current environment status:"
                      sqlite3 env_queue.db "SELECT slug, status, pr_number, acquired_at FROM environments ORDER BY slug;"
                      exit 1
                    fi
                    
                    echo "⏳ No environments available, waiting 30 seconds..."
                    sleep 30
                  done

            - name: Upload Environment Queue Database
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: actions/upload-artifact@v4
              with:
                  name: environment-queue-db
                  path: env_queue.db

            - name: Get Template Version
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              run: |-
                  version=`jq -r ".version" packages/template-retail-react-app/package.json`
                  echo "retail_app_template_version=$version" >> "$GITHUB_ENV"

            - name: Generate Retail App Private Client
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: ./.github/actions/e2e_generate_app
              with:
                  PROJECT_KEY: 'retail-app-private-client'
                  TEMPLATE_VERSION: ${{ env.retail_app_template_version }}

            - name: Validate Retail App Without Extensibility
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: ./.github/actions/e2e_validate_generated_app
              with:
                  PROJECT_KEY: 'retail-app-no-ext'
                  TEMPLATE_VERSION: ${{ env.retail_app_template_version }}

            # TODO: Revisit the next 2 steps to see if we can use the existing .github/actions/deploy_app action.
            - name: Create MRT credentials file
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: './.github/actions/create_mrt'
              with:
                  mobify_user: ${{ secrets.MOBIFY_CLIENT_USER }}
                  mobify_api_key: ${{ secrets.MOBIFY_CLIENT_API_KEY }}

            - name: Push Bundle to MRT (E2E Test PWA Kit)
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              uses: './.github/actions/push_to_mrt'
              with:
                  CWD: '../generated-projects/retail-app-no-ext'
                  # 🦕 GRUG SIMPLE: Use environment variable instead of complex locking
                  TARGET: ${{ env.MRT_TARGET_SLUG }}
                  FLAGS: --wait

            - name: Install Playwright Browsers
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              run: npx playwright install --with-deps

            - name: Run Playwright tests
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              run: npm run test:e2e

            - name: Run Playwright a11y tests
              if: ${{ env.SKIP_WORKFLOW != 'true' }}
              run: npm run test:e2e:a11y

            # 🦕 GRUG SIMPLE: Release environment back to the pool
            - name: Download Environment Queue for Cleanup
              if: always()
              uses: actions/download-artifact@v4
              with:
                  name: environment-queue-db
                  path: .
              continue-on-error: true

            - name: Release MRT Environment
              if: always() # Always release even if tests fail
              run: |
                  if [ -n "${{ env.MRT_TARGET_SLUG }}" ] && [ -f "env_queue.db" ]; then
                    echo "🔓 Releasing environment: ${{ env.MRT_TARGET_SLUG }}"
                    sqlite3 env_queue.db << 'EOF'
                    UPDATE environments 
                    SET status = 'available', 
                        pr_number = NULL,
                        acquired_at = NULL,
                        acquired_by = NULL
                    WHERE acquired_by = '${{ github.run_id }}';
                    EOF
                    
                    echo "✅ Environment ${{ env.MRT_TARGET_SLUG }} released back to pool"
                    echo "📊 Final environment status:"
                    sqlite3 env_queue.db "SELECT slug, status, pr_number FROM environments ORDER BY slug;"
                  else
                    echo "ℹ️ No environment to release or database not found"
                  fi

            - name: Upload Final Environment Queue State
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: environment-queue-db
                  path: env_queue.db
              continue-on-error: true
