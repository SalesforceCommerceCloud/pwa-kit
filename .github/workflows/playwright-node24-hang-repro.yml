name: SalesforceCommerceCloud/pwa-kit/playwright-node24-hang-repro

# TEMPORARY — controlled A/B proof, DELETE after the experiment.
#
# Goal: prove that the nightly `e2e` 6h hang is the Node 24.16.0 stream
# regression (nodejs/node#62557, "stream: pause/resume on destroyed streams
# should be noop"), exposed via Playwright's zip-extraction dependency
# (extract-zip -> yauzl -> fd-slicer), and that bumping @playwright/test to
# >=1.60.0 (microsoft/playwright#40747 "fix(yauzl): vendor yauzl with
# destroy-lifecycle fix") removes the trigger and makes the install succeed.
#
# Single-variable experiment: Node is PINNED to the known-broken 24.16.0 in
# BOTH runs; the only thing that changes between commit 1 (red) and commit 2
# (green) is the resolved @playwright/test version in package-lock.json.
#
#   commit 1 (this file only): lockfile resolves @playwright/test 1.57.0  -> install HANGS, killed at 12m  (NEGATIVE TEST)
#   commit 2 (bump dep+lock):  lockfile resolves @playwright/test >=1.60  -> install SUCCEEDS in ~2-3m      (POSITIVE TEST)
#
# This workflow takes NO untrusted input: every run: block uses only static
# literals (no ${{ github.event.* }} interpolation), so it has no injection surface.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/playwright-node24-hang-repro.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/pwa-kit-mcp/package.json"

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (PINNED to the known-broken 24.16.0)
        # The nightly failing cells resolved to exactly 24.16.0. The regression
        # spans 24.16.0-24.17.x and is fixed in 24.18.0, so pin to 24.16.0 to
        # guarantee reproduction and keep Node constant across both runs.
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Show resolved Playwright version (the variable under test)
        run: |-
          echo "Node: $(node -v)"
          npm ls @playwright/test playwright-core || true

      - name: Install Playwright Browsers
        # This is the EXACT step that hangs in the nightly e2e workflow.
        # A healthy `--with-deps` install finishes in ~2-3 min; the Node-24.16.0
        # extraction deadlock would otherwise burn GitHub's 6h ceiling, so bound
        # it to 12m. Exit 124 (timed out) => step fails => the negative test.
        run: |-
          set -x
          timeout --kill-after=2m 12m npx playwright install --with-deps
