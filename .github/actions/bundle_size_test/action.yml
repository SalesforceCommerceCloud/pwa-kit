name: bundle_size_test
inputs:
  cwd:
    required: true
  config:
    required: true
runs:
  using: composite
  steps:
  - name: Analyze build
    working-directory: ${{ inputs.cwd }}
    run: |-
        npm run analyze-build
    shell: bash

  - name: Check bundle sizes
    working-directory: ${{ inputs.cwd }}
    run: |-
        # npx bundlesize -f "build/main.js" -s 10kB
        # npx bundlesize -f "build/vendor.js" -s 390kB

        json_string='${{ inputs.config }}'

        # Use jq to parse the JSON string and iterate over each key-value pair
        echo $json_string | jq -r 'to_entries[] | "npx bundlesize -f \"" + .key + "\" -s " + .value' | while read -r command; do
          eval $command
        done
    shell: bash

  - name: Report bundle sizes
    run: |-
        node ./scripts/report-bundle-size.js ${{ inputs.cwd }}/build
    shell: bash
