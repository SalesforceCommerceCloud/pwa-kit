name: bundlesize
inputs:
  cwd:
    required: true
runs:
  using: composite
  steps:
  - name: Analyze build
    working-directory: ${{ inputs.cwd }}
    run: |-
        npm run analyze-build
    shell: bash

  # TODO: is it possible to set size thresholds in the world of extensions? Yes: npx bundlesize --config ../../../bundlesize.config.json
  - name: Check bundle size
    working-directory: ${{ inputs.cwd }}
    run: |-
        echo ${{ github.action_path }}
        npx bundlesize
    shell: bash

  - name: Report bundle size
    run: |-
        node ./scripts/report-bundle-size.js ${{ inputs.cwd }}/build
    shell: bash
