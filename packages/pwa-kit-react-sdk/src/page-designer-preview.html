<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Designer Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #root {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        // Initialize the React app
        window.addEventListener('DOMContentLoaded', function() {
            // This would typically load the React app from a bundle
            // For now, we'll just show a placeholder
            const root = document.getElementById('root');
            root.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100vh;">
                    <div style="text-align: center;">
                        <h2>Page Designer Preview</h2>
                        <p>React app would be loaded here</p>
                        <p>Site: ${window.SITE || 'Unknown'}</p>
                        <p>Locale: ${window.USER_LOCALE || 'Unknown'}</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
